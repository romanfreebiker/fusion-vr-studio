<!doctype html><html lang="es"><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESKALA Viewer · Dirección</title><style>.eskala-sign{display:block;font:italic 11px system-ui;color:#aabbd1;letter-spacing:.3px;margin-top:4px}.eskala-sign b{color:#ff6900;font-style:normal}.eskala-cube{color:#49c9e8}</style><style>body{margin:0;background:#101827;color:#eef5ff;font:16px system-ui}main{max-width:1200px;margin:auto;padding:32px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0}p{color:#aabbd1}button,a{font:inherit;border:1px solid #52749a;border-radius:9px;background:#253b55;color:white;padding:10px 14px;text-decoration:none;cursor:pointer}button:active,a:active{background:#63b5f8;color:#142034}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}article{background:#182436;border:1px solid #354a63;border-radius:14px;overflow:hidden}article img,.placeholder{width:100%;height:160px;object-fit:cover;background:#253b55}.placeholder{display:grid;place-items:center;font-size:44px}section{padding:16px}h2{font-size:18px;margin:0 0 10px}.actions{display:flex;flex-wrap:wrap;gap:8px}.warn{color:#ffd18a}input{padding:10px;background:#182436;color:white;border:1px solid #52749a;border-radius:8px;width:min(350px,90%)}@media(max-width:600px){main{padding:16px}header{gap:8px;margin-bottom:12px}h1{font-size:21px;line-height:1.2}header p{font-size:13px;margin:6px 0}header button{padding:7px 12px;font-size:13px}input{box-sizing:border-box;width:100%}#grid{gap:12px;grid-template-columns:1fr}article img,.placeholder{height:150px}section{padding:12px}.actions{gap:6px}.actions a,.actions button{font-size:13px;padding:8px 10px}}</style><style id="eskala-direccion-band-v2">.eskala-direccion-band{position:sticky;top:0;z-index:100;background:#151e26;border-bottom:1px solid #00b8e5;box-shadow:0 4px 22px #02080e66;padding:8px clamp(12px,2vw,32px);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.eskala-direccion-band img{display:block;width:min(535px,100%);height:auto;max-height:none;object-fit:contain;object-position:left center;mix-blend-mode:screen}.eskala-direccion-band nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}.eskala-direccion-band nav a,.eskala-direccion-band nav button{font:700 12px system-ui;color:#e5f6ff;background:#10202d;border:1px solid #22647b;border-radius:9px;padding:10px 13px;text-decoration:none;cursor:pointer}.eskala-direccion-band nav a:hover,.eskala-direccion-band nav button:hover{background:#12384c;border-color:#18d9ff}.eskala-director-loading{font:600 12px system-ui;color:#8ee9fd;white-space:nowrap;padding:7px}.eskala-director-loading[hidden]{display:none!important}main>header{margin-bottom:18px}@media(max-width:720px){.eskala-direccion-band{gap:5px;padding:6px 9px}.eskala-direccion-band img{width:min(334px,100%);max-height:none}.eskala-direccion-band nav{margin-left:0}.eskala-direccion-band nav a,.eskala-direccion-band nav button{padding:8px 10px}} </style><body><div class="eskala-direccion-band"><img src="./assets/eskala-corporativa.webp?v=2" alt="ESKALA · Design Beyond the Screen · by Roman · 62 Sesenta y Dos" width="640" height="77"><nav aria-label="Acciones de Dirección"><span id="directorLoading" class="eskala-director-loading" role="status" aria-live="polite">Cargando biblioteca…</span><button id="refresh" type="button">Actualizar</button></nav></div><main><header><div><h1>Biblioteca · Dirección</h1><p>Diseños recibidos de la central</p></div></header><p id="demo" class="warn" hidden>Biblioteca sincronizada en GitHub. Los archivos son públicos.</p><input id="search" placeholder="Buscar diseño…"><p id="status" role="status"></p><div id="grid"></div></main><script src="distribucion.js?v=32"></script><script>
const D=window.FusionDistribution, grid=document.getElementById('grid'), status=document.getElementById('status'), search=document.getElementById('search');document.getElementById('demo').hidden=true;let rows=[],loadSequence=0, loaded=false;D.configureStoredAdmin?.();
function askShareDetails(){
 return new Promise(resolve=>{
  const overlay=document.createElement('div');Object.assign(overlay.style,{position:'fixed',inset:'0',zIndex:'100000',background:'#07101bd9',display:'grid',placeItems:'center',padding:'18px'});
  const box=document.createElement('div');Object.assign(box.style,{width:'min(420px,92vw)',background:'#142236',border:'1px solid #42607d',borderRadius:'14px',padding:'18px',color:'#eef7ff',boxShadow:'0 18px 55px #0008',font:'14px system-ui'});
  const title=document.createElement('h3');title.textContent='Compartir por WhatsApp';title.style.margin='0 0 14px';
  const nameLabel=document.createElement('label');nameLabel.textContent='Nombre del destinatario (opcional)';Object.assign(nameLabel.style,{display:'grid',gap:'6px'});
  const name=document.createElement('input');name.type='text';name.maxLength=80;name.placeholder='Ej. Juan, Proveedor, Cliente…';Object.assign(name.style,{width:'100%',boxSizing:'border-box',padding:'10px',borderRadius:'8px',border:'1px solid #4a6380',background:'#0f1a29',color:'#fff'});nameLabel.append(name);
  const timeLabel=document.createElement('label');timeLabel.textContent='Tiempo de exposición (horas)';Object.assign(timeLabel.style,{display:'grid',gap:'6px',marginTop:'12px'});
  const hours=document.createElement('input');hours.type='number';hours.min='1';hours.max='720';hours.step='0.5';hours.placeholder='24';Object.assign(hours.style,{width:'100%',boxSizing:'border-box',padding:'10px',borderRadius:'8px',border:'1px solid #4a6380',background:'#0f1a29',color:'#fff'});timeLabel.append(hours);
  const note=document.createElement('div');note.textContent='Si dejas el tiempo vacío, el enlace durará 24 horas.';Object.assign(note.style,{fontSize:'12px',color:'#aabbd1',marginTop:'8px'});
  const actions=document.createElement('div');Object.assign(actions.style,{display:'flex',justifyContent:'flex-end',gap:'8px',marginTop:'16px'});
  const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancelar';
  const send=document.createElement('button');send.type='button';send.textContent='Continuar a WhatsApp';
  for(const b of [cancel,send])Object.assign(b.style,{padding:'9px 12px',borderRadius:'8px',border:'1px solid #4a6380',background:'#18304a',color:'#fff',cursor:'pointer'});
  function close(value){overlay.remove();resolve(value)}
  cancel.onclick=()=>close(null);overlay.onclick=e=>{if(e.target===overlay)close(null)};
  send.onclick=()=>{const raw=String(hours.value||'').trim();const value=raw?Number(raw.replace(',','.')):24;if(!Number.isFinite(value)||value<=0||value>720){status.textContent='Introduce un tiempo entre 1 y 720 horas.';hours.focus();return}close({recipient:String(name.value||'').trim().slice(0,80),hours:value});};
  actions.append(cancel,send);box.append(title,nameLabel,timeLabel,note,actions);overlay.append(box);document.body.append(overlay);name.focus();
 });
}

function render(){
 grid.replaceChildren();
 for(const m of rows.filter(x=>x.nombre.toLowerCase().includes(search.value.toLowerCase()))){
  const a=document.createElement('article');
  if(m.miniatura){
   const img=document.createElement('img');img.alt='';
   img.onerror=()=>{const p=document.createElement('div');p.className='placeholder';p.textContent='Vista 3D';img.replaceWith(p)};
   img.src=new URL(m.miniatura,location.href).href;a.append(img);
  }else{const p=document.createElement('div');p.className='placeholder';p.textContent='◇';a.append(p)}
  const s=document.createElement('section'),h=document.createElement('h2');h.textContent=m.nombre;s.append(h);
  const p=document.createElement('p');p.textContent=m.descripcion||m.categoria||'';s.append(p);
  const third=document.createElement('div');
  Object.assign(third.style,{display:'grid',gap:'7px',margin:'8px 0 12px'});
  const thirdTitle=document.createElement('strong');thirdTitle.textContent='Accesos a terceros';third.append(thirdTitle);
  const thirdShare=document.createElement('div');Object.assign(thirdShare.style,{display:'flex',gap:'6px',flexWrap:'wrap'});
  const whatsapp=document.createElement('button');whatsapp.textContent='WhatsApp';
  whatsapp.onclick=async()=>{
    const details=await askShareDetails();if(!details)return;
    whatsapp.disabled=true;
    try{
      await D.shareWhatsApp(m.id,m.nombre,details.hours,'direction',details.recipient);
      await loadThird();
    }catch(e){status.textContent=e.message}
    finally{whatsapp.disabled=false}
  };
  const email=document.createElement('button');email.textContent='Correo';
  email.onclick=async()=>{
    email.disabled=true;
    try{
      await D.shareEmail(m.id,m.nombre,'direction');
      await loadThird();
    }catch(e){status.textContent=e.message}
    finally{email.disabled=false}
  };
  thirdShare.append(whatsapp,email);third.append(thirdShare);
  const thirdBody=document.createElement('div');thirdBody.textContent='Comprobando accesos…';third.append(thirdBody);s.append(third);

  async function loadThird(){
   try{
    const list=await D.listThirdParty(m.id,true,'direction');
    thirdBody.replaceChildren();
    if(!list.length){
      const empty=document.createElement('span');empty.textContent='Sin accesos a terceros';empty.style.color='#aabbd1';thirdBody.append(empty);return;
    }
    for(const row of list){
      const line=document.createElement('div');
      Object.assign(line.style,{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap',padding:'7px 0',borderBottom:'1px solid #2e435a'});
      const label=document.createElement('span');
      const originLabel=row.origin==='direction'?'Desde Dirección':row.origin==='central'?'Desde Central':'Origen anterior';
      label.textContent=row.recipient+' · '+originLabel+' · ACTIVO · '+(row.remaining||'');
      label.style.flex='1';label.style.minWidth='150px';
      line.append(label);
      const disable=document.createElement('button');disable.textContent='Desactivar a terceros';
      disable.onclick=async()=>{try{await D.deactivateThirdPartyAccess(row.id,'direction');await loadThird()}catch(e){status.textContent=e.message}};
      line.append(disable);thirdBody.append(line);
    }
   }catch(e){thirdBody.textContent='No se han podido consultar los accesos. '+e.message}
  }
  loadThird();
  const timer=setInterval(()=>{if(a.isConnected&&!document.hidden)loadThird();else if(!a.isConnected)clearInterval(timer)},60000);

  const actions=document.createElement('div');actions.className='actions';
  const open=document.createElement('a');open.href=D.viewer(m.id,'director');open.textContent='Abrir diseño';actions.append(open);
  const remove=document.createElement('button');remove.textContent='Quitar de mi biblioteca';
  remove.onclick=async()=>{if(!confirm('¿Quitar '+m.nombre+' de tu biblioteca de Dirección?\n\nLa Central conservará el diseño original.'))return;try{await D.setStatus(m.id,'inactive','director');await load();status.textContent='Diseño retirado de Dirección. La Central ya lo mostrará como no enviado.';}catch(e){status.textContent=e.message}};
  actions.append(remove);s.append(actions);a.append(s);grid.append(a);
 }
}
async function load(){
 const seq=++loadSequence;
 if(!loaded){status.textContent='Comprobando diseños activos…';document.getElementById('directorLoading').hidden=false;}
 try{
   if(typeof D?.list!=='function'||typeof D.viewer!=='function')throw Error('Actualiza la página para cargar la versión actual.');
   const fresh=await D.list('director',true);
   if(seq!==loadSequence)return;
   if(!loaded||JSON.stringify(rows)!==JSON.stringify(fresh)){rows=fresh;render();}
   loaded=true;
   status.textContent=rows.length?rows.length+' diseños recibidos':'Todavía no tienes diseños activos.';
 }catch(e){if(seq===loadSequence){status.textContent='No se ha podido actualizar la biblioteca. '+e.message;}}
 finally{if(seq===loadSequence)document.getElementById('directorLoading').hidden=true;}
}
search.oninput=render;document.getElementById('refresh').onclick=load;
addEventListener('pageshow',load);addEventListener('storage',load);addEventListener('focus',load);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
setInterval(()=>{if(!document.hidden)load()},D?.refreshInterval||20000);
(async()=>{
 try{
   const migrated=await D.migrateLegacyDirectionHidden?.();
   if(migrated)status.textContent='Sincronizando retiradas anteriores de Dirección…';
 }catch(e){status.textContent='No se pudieron sincronizar las retiradas anteriores. '+e.message}
 await load();
})();
</script></html>
