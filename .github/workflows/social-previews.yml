name: ESKALA - vistas previas WhatsApp y correo

on:
  push:
    branches: [main]
    paths:
      - 'catalogo.json'
      - 'distribucion.json'
      - 'miniaturas/**'
      - 'modelos/**'
      - 'assets/eskala-corporativa.webp'
      - 'scripts/generate_social_previews.py'
      - '.github/workflows/social-previews.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: eskala-social-previews
  cancel-in-progress: false

jobs:
  generate-social-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar generador
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Generar tarjetas y enlaces
        run: python -u scripts/generate_social_previews.py --shorten
      - name: Publicar si hay cambios
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- social/ v/ p/ s/
          if ! git diff --cached --quiet; then
            git commit -m "Generar miniaturas ESKALA para compartir"
            git push origin HEAD:main
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
          else
            echo "Sin cambios en las vistas previas."
          fi
