name: ESKALA - optimizar tarjeta oficial
on:
  push:
    branches: [main]
    paths:
      - 'social/acceso-eskala.png'
      - '.github/workflows/eskala-access-card.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: eskala-access-card
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Optimize approved card for fast mobile previews
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('social/acceso-eskala-wa-v2.jpg')
          with Image.open('social/acceso-eskala.png') as source:
              image=source.convert('RGB').resize((960,540), Image.Resampling.LANCZOS)
              for quality in (82,78,74,70,66,62,58,54,50):
                  image.save(p, 'JPEG', quality=quality, optimize=True, subsampling=2, progressive=False)
                  if p.stat().st_size < 100000:
                      break
              assert p.stat().st_size < 100000
              assert Image.open(p).size == (960,540)
              print('WhatsApp image bytes:', p.stat().st_size)
          PY
      - name: Publish optimized copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/acceso-eskala-wa-v2.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Optimize approved ESKALA card for WhatsApp"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
