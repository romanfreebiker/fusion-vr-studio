name: Deploy ESKALA permisos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare-permisos/**'
      - '.github/workflows/deploy-eskala-permisos.yml'
permissions:
  contents: read
concurrency:
  group: eskala-permisos-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate credentials and source
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          node --input-type=module --check < cloudflare-permisos/worker.js
      - name: Deploy permissions Worker
        working-directory: cloudflare-permisos
        run: npx --yes wrangler@4 deploy --config wrangler.json
      - name: Verify live service
        run: |
          expected=$(grep -oE 'version:[0-9]+,ready' cloudflare-permisos/worker.js | grep -oE '[0-9]+')
          test -n "$expected"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 https://eskala-permisos.taller-mantenimiento.workers.dev/health | jq -e --argjson version "$expected" '.service == "eskala-permisos" and .version == $version and .database == true and .ready == true'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
