<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESKALA Taller</title><style>body{margin:0;background:#151e26;color:#eaf5ff;font:16px system-ui}header,main{max-width:1000px;margin:auto;padding:18px}header img{width:min(100%,420px)}button,a,select{background:#18354b;color:white;border:1px solid #38718d;border-radius:8px;padding:12px;font:inherit;text-decoration:none;display:inline-block}article{background:#202e3b;border-radius:12px;padding:14px;display:grid;gap:10px}article img{width:100%;height:160px;object-fit:contain;background:#111a24}#jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}p{color:#b7c9d8}h2{margin:0}textarea{font:inherit;width:100%;box-sizing:border-box;background:#14222e;color:white;border:1px solid #456;padding:8px}</style><header><img src="assets/eskala-corporativa.webp" alt="ESKALA"><h1>Mis trabajos · Taller</h1><button id="refresh">Actualizar</button><p id="status" role="status">Cargando…</p></header><main><div id="jobs"></div></main><script src="taller.js?v=142"></script><script>
const adminId=new URLSearchParams(location.search).get('adminWorker'), key=location.hash.slice(1), status=document.querySelector('#status'), grid=document.querySelector('#jobs');let signature='';if(adminId){const back=document.createElement('a');back.href='index.html';back.textContent='Volver a Gestión';document.querySelector('header').append(back)}
function el(tag,t){const x=document.createElement(tag);x.textContent=t;return x}
async function load(){try{const {w,jobs}=await (adminId?EskalaTaller.adminWorker(adminId):EskalaTaller.worker(key));status.textContent=w.label+' · '+jobs.length+' trabajos asignados';const sig=JSON.stringify(jobs);if(sig===signature)return;signature=sig;grid.replaceChildren();for(const j of jobs){const a=el('article','');if(j.model.miniatura){const img=el('img','');img.src=j.model.miniatura;img.alt='';a.append(img)}a.append(el('h2',j.model.nombre),el('p',j.type+' · Prioridad '+j.priority+' · '+j.phase));const open=el('a','Abrir visor y medir');open.href=EskalaTaller.viewer(key,j.design);if(adminId){const u=new URL(open.href);u.searchParams.set('adminWorker',adminId);open.href=u.href}a.append(open);const note=el('p',j.note||'');a.append(note);const localKey='eskala-taller:'+w.id+':'+j.design;const local=el('select','');for(const p of EskalaTaller.phases)local.add(new Option(p,p));const memo=el('textarea','');memo.placeholder='Observaciones personales';try{const saved=JSON.parse(localStorage.getItem(localKey)||'{}');local.value=saved.phase||j.phase;memo.value=saved.note||''}catch{}const save=()=>{try{localStorage.setItem(localKey,JSON.stringify({phase:local.value,note:memo.value}))}catch{}};local.onchange=save;memo.oninput=save;a.append(el('small','Seguimiento personal (solo en este dispositivo; no se envía a Gestión)'),local,memo);grid.append(a)}}catch(e){status.textContent=e.message;grid.replaceChildren();signature=''}}
document.querySelector('#refresh').onclick=load;load();const stopLive=EskalaTaller.subscribe?.(()=>{signature='';if(!document.hidden)load()},e=>console.warn('[ESKALA Operario] sync',e));setInterval(()=>{if(!document.hidden)load()},30000);addEventListener('pagehide',()=>{try{stopLive?.()}catch{}});
</script></html>
